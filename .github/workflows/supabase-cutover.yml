name: Supabase Auth Cutover

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cutover:
    if: ${{ !contains(github.event.head_commit.message, '[supabase-cutover]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Replace Firebase runtime with Supabase
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          firebase_block = re.compile(r'\s*<!-- Google Firebase Compatibility SDKs \(v10\.7\.1\) -->.*?<script src="https://www\.gstatic\.com/firebasejs/10\.7\.1/firebase-analytics-compat\.js"></script>', re.S)
          supabase_block = '''\n  <!-- Supabase Authentication + database (Firebase removed) -->\n  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n  <script src="./js/supabase-init.js"></script>\n  <script src="./js/supabase-firebase-compat.js"></script>'''
          s, count = firebase_block.subn(supabase_block, s, count=1)
          if count != 1:
              raise SystemExit('Firebase SDK block not found; refusing to modify index.html')

          init_block = re.compile(r'\s*const firebaseConfig = \{.*?\n\s*const analytics = firebase\.analytics\(\);', re.S)
          init_replacement = '''\n    // Supabase is the only authentication/database backend.\n    const db = window.db;\n    const auth = window.auth;\n    const analytics = null;\n    if (!db || !auth || !window.supabaseClient) {\n      throw new Error('Supabase failed to initialize. Check js/supabase-init.js and Supabase configuration.');\n    }'''
          s, count = init_block.subn(init_replacement, s, count=1)
          if count != 1:
              raise SystemExit('Firebase initialization block not found; refusing to modify index.html')

          s = s.replace("const provider = new firebase.auth.GoogleAuthProvider();\n      try {\n        await auth.signInWithPopup(provider);", "try {\n        await auth.signInWithPopup();")
          s = s.replace("const firestoreProfile = globalRawProfilesData[email];", "const firestoreProfile = globalRawProfilesData[email] || globalRawProfilesData[user.id] || globalRawProfilesData[user.uid];")
          users_block = '''      try {\n        const usersSnapshot = await db.collection("users").get();\n        globalRawUsersData = {};\n        usersSnapshot.forEach(doc => {\n          globalRawUsersData[doc.id] = doc.data();\n        });\n      } catch (e) {\n        console.warn('Error loading legacy user profiles:', e);\n      }'''
          s = s.replace(users_block, "      // Firebase's legacy users collection is no longer used; Supabase profiles are keyed by auth UUID.")

          p.write_text(s, encoding='utf-8')

      - name: Remove Firebase service workers
        run: |
          rm -f firebase-messaging-sw.js firebase-messaging-pwa-sw.js

      - name: Verify no Firebase SDK remains in index
        run: |
          ! grep -E 'gstatic\.com/firebase|firebase-app-compat|firebase-firestore-compat|firebase-auth-compat|firebase-messaging-compat|firebase-analytics-compat' index.html

      - name: Commit Supabase cutover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/supabase-firebase-compat.js firebase-messaging-sw.js firebase-messaging-pwa-sw.js
          if git diff --cached --quiet; then
            echo 'No cutover changes required.'
            exit 0
          fi
          git commit -m 'fix: complete Supabase auth cutover [supabase-cutover]'
          git push
